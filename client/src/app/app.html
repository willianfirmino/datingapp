<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
  <h2 class="card-title text-4xl">Welcome to DatingApp!</h2>
  <p class="text-lg">This is a simple dating application built with Angular and .NET Core.</p>
  <ul class="list">
    @for (member of members(); track $index) {
      <li class="list-row items-center">
        <img src="/user.png"  alt="user avatar" class="size-12 rounded-box">
        <div>{{member.displayName}}</div>
      </li>
    }
  </ul>

</div>
